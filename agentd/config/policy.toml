# /etc/agentd/policy.toml
#
# Safety / approval model, modeled on AI CLI harnesses.
# A global MODE crossed with per-tool RULES. Approval is an EVENT on the bus,
# not an inline check — so `yolo` is pure config (the policy engine simply
# auto-approves), and every approval decision lands in the event log as a
# free audit trail.

# suggest   = every tool call needs approval (safe default)   ~ CC `default`
# auto-edit = reads/edits auto; mutations outside workspace or
#             command execution ask                            ~ CC `acceptEdits`
# yolo      = nothing asks; air-gapped full-send               ~ CC `bypassPermissions`
mode = "suggest"

[rules]
# "allow"     -> never asks
# "ask"       -> always asks (in suggest/auto-edit; yolo overrides)
# "workspace" -> auto if the path is inside AGENTD_WORKSPACE, else ask
"fs.read"     = "allow"
"fs.write"    = "workspace"
"shell.exec"  = "ask"
"cerebro.*"   = "allow"        # memory ops are safe
"net.*"       = "ask"
"agent.spawn"       = "ask"    # gate sub-agent fan-out / depth
"read_soul_md"       = "allow"  # read-only, no side effects
"propose_evolution"  = "ask"    # structural changes require explicit user approval before apply
"rollback_evolution" = "ask"    # rollback is destructive — always confirm

# apexos-tools
# Rule enum values: allow (never asks), ask (always asks), workspace (auto inside AGENTD_WORKSPACE)
"run_command"  = "ask"
"write_file"   = "workspace"
"delete_path"  = "ask"
"read_file"    = "allow"
"list_dir"     = "allow"
"create_dir"   = "workspace"
"http_fetch"   = "allow"
"cpu_temp"     = "allow"
"disk_usage"   = "allow"
"memory_info"  = "allow"
"uptime"       = "allow"

# notifications
"notify" = "allow"

# scheduler — agent manages its own heartbeat
"schedule_task"    = "allow"
"list_schedules"   = "allow"
"cancel_schedule"  = "allow"

# sensor-head — physical senses (proxy to dashboard REST, no direct I2C)
"sense_environment" = "allow"
"read_thermal"      = "allow"
"sense_thermal"     = "allow"
"capture_visual"    = "ask"
"capture_night"     = "ask"
"detect_objects"    = "allow"
"classify_scene"    = "allow"
"get_head_status"   = "allow"

# Optional knobs for the multi-agent layer (wire in §8):
[subagents]
max_depth        = 4           # how deep the spawn tree may go
max_concurrent   = 16          # paired with the inference-client semaphore
inherit_mode     = true        # children inherit the parent's mode by default
