# /etc/agentd/plugins.toml
#
# Declared plugins, read at boot by the supervisor. A plugin is ANY process
# that speaks MCP over stdio — so any language works, and CerebroCortex runs
# unmodified. Adding a capability = add a [[plugin]] block (or, once
# hot-reload lands, `agentctl plugin add`).

[[plugin]]
id      = "cerebro"
cmd     = "python"
args    = ["-m", "cerebrocortex.mcp"]   # <-- confirm the real entrypoint in CC
restart = "always"
# cwd / env can be added here as needed, e.g.:
# cwd   = "/opt/cerebrocortex"
# env   = { CEREBRO_DB = "/var/lib/agentd/cerebro.db" }

[[plugin]]
id      = "shell"
cmd     = "/usr/lib/agentd/plugins/shell-mcp"   # bundled Rust binary
restart = "on-failure"

[[plugin]]
id      = "fs"
cmd     = "/usr/lib/agentd/plugins/fs-mcp"      # bundled Rust binary
restart = "on-failure"
