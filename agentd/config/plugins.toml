# /etc/agentd/plugins.toml  (dev: agentd/config/plugins.toml)
#
# A plugin is ANY process that speaks MCP over stdio.
# Adding a capability = add a [[plugin]] block.

[[plugin]]
id      = "cerebro"
cmd     = "/home/andre/Projects/CerebroCortex/cerebro-mcp"
args    = []
restart = "always"
# Production Pi path will be different — update when deploying.
# env = { CEREBRO_DATA_DIR = "/var/lib/agentd/cerebro" }

[[plugin]]
id      = "apexos-tools"
cmd     = "/usr/local/bin/apexos-tools"
restart = "always"

[[plugin]]
id      = "sensor-head"
cmd     = "/usr/local/bin/sensor-head-mcp"
restart = "always"
