[workspace]
members = [
    "crates/core",
    "crates/gateway",
    "crates/plugins",
    "crates/agentd",
]
resolver = "2"

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["full"] }
anyhow     = "1"
futures-util = "0.3"
