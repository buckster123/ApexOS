[package]
name = "apexos-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
apexos-core  = { path = "../core" }
axum         = { version = "0.8", features = ["ws"] }
tower-http   = { version = "0.6", features = ["fs"] }
tokio        = { workspace = true }
serde_json   = { workspace = true }
futures-util = { workspace = true }
anyhow       = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
tungstenite       = "0.26"
